    <style>
      body { margin: 0; }
      .boot-screen { box-sizing: border-box; display: grid; place-items: center; min-height: 100vh; padding: 24px; background: radial-gradient(ellipse at 60% 33%, #182951, #0a0f2c 68%); color: #eef6ff; font-family: system-ui, sans-serif; }
      .boot-screen > div { width: min(100%, 620px); padding: 26px 0; border-block: 1px solid #344564; }
      .boot-screen h1 { margin: 0; text-align: start; font-size: clamp(52px, 13vw, 115px); letter-spacing: -.08em; line-height: 1.05; }
      .boot-screen h1 bdi { font-weight: 800; letter-spacing: -.08em; }
      .boot-screen h1 span { color: #54c9ff; }
      .boot-screen p { margin: 13px 0 22px; color: #c6d5ea; line-height: 1.75; }
      .boot-screen a { display: inline-block; padding: 10px 16px; color: #e8f6ff; border: 1px solid #5983a8; border-radius: 99px; text-decoration: none; }
      .boot-screen a:focus-visible { outline: 2px solid #75d5ff; outline-offset: 4px; }
      html[lang="ar"] .boot-en, html[lang="en"] .boot-ar { display: none; }
    </style>
  </head>

    <div id="root">
      <main class="boot-screen">
        <div>
          <h1><bdi lang="en">ZUUN<span>.</span></bdi></h1>

            <p>An independent digital studio. If the site has not loaded, open the standalone preview.</p>
            <a href="./preview/index.html">Open the site preview</a>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
